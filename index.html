<!DOCTYPE html>
<html lang="zh-SG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅德小学五年级华文写作批改系统</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#f8fafc;color:#1e293b;display:flex;align-items:center;
  justify-content:center;padding:28px
}
.card{
  width:min(900px,100%);background:white;border-radius:24px;padding:42px;
  box-shadow:0 18px 50px rgba(15,23,42,.12)
}
h1{margin:0;text-align:center;font-size:30px}
h2{margin:8px 0 10px;text-align:center;font-size:22px}
.sub{text-align:center;color:#64748b;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
a{
  display:flex;align-items:center;justify-content:center;min-height:86px;
  text-decoration:none;border:2px solid #e2e8f0;border-radius:18px;
  font-size:22px;font-weight:700;color:#1e3a8a;background:#fff;
  transition:.15s ease
}
a:hover{
  border-color:#2563eb;transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(37,99,235,.12)
}
.note{
  margin-top:28px;padding:16px 18px;border-radius:14px;background:#f1f5f9;
  color:#475569;line-height:1.55;font-size:14px
}
@media(max-width:650px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .card{padding:26px}
}
</style>
</head>
<body>
<div class="card">
  <h1>雅德小学</h1>
  <h2>五年级华文写作批改系统</h2>
  <div class="sub">P5 Chinese Writing Marking System · INDEX</div>

  <div class="grid">
    <a href="./p5-writing.html?form=P5-C">P5-C</a>
    <a href="./p5-writing.html?form=P5-E">P5-E</a>
    <a href="./p5-writing.html?form=P5-H">P5-H</a>
    <a href="./p5-writing.html?form=P5-I">P5-I</a>
    <a href="./p5-writing.html?form=P5-O">P5-O</a>
    <a href="./p5-writing.html?form=P5-RS">P5-RS</a>
  </div>

  <div class="note">
    请选择级任班。进入批改页面后，系统会自动带入所选级任班，
    再选择母语班及学生进行一改或二改。
  </div>
</div>
</body>
</html>
