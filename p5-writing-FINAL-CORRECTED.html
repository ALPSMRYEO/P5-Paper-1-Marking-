        };

        const App = () => {
            const [revisionStage, setRevisionStage] = useState('一改'); // 一改, 二改 (抽查)
            const [student, setStudent] = useState({ class: '', mtl: '', name: '' });
            const [scores, setScores] = useState({ content: '', language: '' });
            const [scoreTouched, setScoreTouched] = useState({ content: false, language: false });
            const [selections, setSelections] = useState({ content: null, language: null });
            
            // Student Marking History Store: { [studentName]: { '一改': { score, content, language, marker }, '二改': { ... } } }
            const [studentScoresHistory, setStudentScoresHistory] = useState({});

            const [feedbackText, setFeedbackText] = useState('');
            const [lastAutoText, setLastAutoText] = useState('');

            // Paste the deployed P5 Writing Apps Script Web App URL below
            const gasUrl = 'https://script.google.com/macros/s/AKfycbxJYjpfNnETRS9Jji1OXabU_-97Hwy0JwkJLJm7QJ6A_mJ9Kacv0c_KnfjQ4IInyjVE/exec';
            const [submitStatus, setSubmitStatus] = useState('idle');
            
            const [currentExaminer, setCurrentExaminer] = useState('');
            const [dialog, setDialog] = useState({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: null, isSuccess: false });

            const currentRubrics = writingRubrics;

            const maxContent = currentRubrics.content.max;
            const maxLanguage = currentRubrics.language.max;
            const maxTotal = maxContent + maxLanguage;

            const contentTotal = Number(scores.content);
            const languageTotal = Number(scores.language);
            const grandTotal = contentTotal + languageTotal;

            // History records for selected student
            const currentStudentHistory = useMemo(() => {
                if (!student.name) return {};
                return studentScoresHistory[student.name] || {};
            }, [student.name, studentScoresHistory]);

            const record1 = currentStudentHistory['一改'];
            const record2 = currentStudentHistory['二改'];

            const score1 = record1?.score;
            const score2 = record2?.score;

            const scoreDiff = useMemo(() => {
                if (score1 !== undefined && score2 !== undefined) {
                    return Math.abs(score1 - score2);
                }
                if (score1 !== undefined && revisionStage === '二改') {
                    return Math.abs(score1 - grandTotal);
                }
                return null;
            }, [score1, score2, grandTotal, revisionStage]);

            // Band Check Logic for Variance Rules
            const isCrossBand = useMemo(() => {
                if (!record1) return false;
                const c1Band = getBandLevel('content', record1.content);
                const c2Band = getBandLevel('content', revisionStage === '二改' ? contentTotal : (record2?.content || 0));
                
                const l1Band = getBandLevel('language', record1.language);
                const l2Band = getBandLevel('language', revisionStage === '二改' ? languageTotal : (record2?.language || 0));

                return (c1Band !== c2Band) || (l1Band !== l2Band);
            }, [record1, record2, contentTotal, languageTotal, revisionStage]);

            // Final Score Calculation Logic according to Rules
            const finalScoreResolution = useMemo(() => {
                if (!record1) {
                    return { 
                        content: contentTotal, 
                        language: languageTotal, 
                        total: grandTotal, 
                        source: '一改 (尚未二改抽查)' 
                    };
                }

                const currentScore2 = revisionStage === '二改' ? grandTotal : (score2 !== undefined ? score2 : null);
                const currentContent2 = revisionStage === '二改' ? contentTotal : (record2?.content !== undefined ? record2.content : null);
                const currentLanguage2 = revisionStage === '二改' ? languageTotal : (record2?.language !== undefined ? record2.language : null);

                if (currentScore2 === null) {
                    return { 
                        content: record1.content, 
                        language: record1.language, 
                        total: record1.score, 
                        source: '一改 (尚未二改抽查)' 
                    };
                }

                const diff = Math.abs(record1.score - currentScore2);

                // Rule 1: Variance <= 3 Marks and NO Cross-Band -> Retain 1st Marking Score
                if (diff <= 3 && !isCrossBand) {
                    return { 
                        content: record1.content, 
                        language: record1.language, 
                        total: record1.score, 
                        source: `一改 (两改分差 ${diff}分 ≤ 3分且未跨等，保持一改成绩)` 
                    };
                }

                // Rule 2: Variance <= 3 Marks WITH Cross-Band -> Take Reference from 2nd Marking
                if (diff <= 3 && isCrossBand) {
                    return { 
                        content: currentContent2, 
                        language: currentLanguage2, 
                        total: currentScore2, 
                        source: `二改 (两改分差 ${diff}分 ≤ 3分，但出现跨等，采用二改标准)` 
                    };
                }

                // Rule 3: Variance > 3 Marks -> Take Reference from 2nd Marking
                return { 
                    content: currentContent2, 
                    language: currentLanguage2, 
                    total: currentScore2, 
                    source: `二改 (两改分差 ${diff}分 > 3分，采用二改标准)` 
                };
            }, [record1, record2, score2, contentTotal, languageTotal, grandTotal, revisionStage, isCrossBand]);

            // Helper to match score with rubric feedback
            const getRubricFeedback = (category, targetScore) => {
                const items = currentRubrics[category].items;
                for (let item of items) {
                    if (item.scores.includes(targetScore)) return item.feedback;
                }
                return "";
            };

            const generatedContentFeedback = useMemo(() => {
                if (revisionStage === '二改' || record2) {
                    return getRubricFeedback('content', finalScoreResolution.content);
                }
                if (selections.content !== null) return currentRubrics.content.items[selections.content].feedback;
                return getRubricFeedback('content', contentTotal);
            }, [revisionStage, record2, finalScoreResolution.content, selections.content, contentTotal, currentRubrics]);

            const generatedLanguageFeedback = useMemo(() => {
                if (revisionStage === '二改' || record2) {
                    return getRubricFeedback('language', finalScoreResolution.language);
                }
                if (selections.language !== null) return currentRubrics.language.items[selections.language].feedback;
                return getRubricFeedback('language', languageTotal);
            }, [revisionStage, record2, finalScoreResolution.language, selections.language, languageTotal, currentRubrics]);

            const generatedFeedback = useMemo(() => {
                let parts = [];
                if (generatedContentFeedback) parts.push(`【内容】\n${generatedContentFeedback}`);
                if (generatedLanguageFeedback) parts.push(`【语文】\n${generatedLanguageFeedback}`);
                return parts.join("\n\n");
            }, [generatedContentFeedback, generatedLanguageFeedback]);

            useEffect(() => {
                setFeedbackText((currentText) => {
                    if (!currentText || currentText === lastAutoText) {
                        return generatedFeedback;
                    }
                    if (lastAutoText && currentText.includes(lastAutoText)) {
                        return currentText.replace(lastAutoText, generatedFeedback);
                    }
                    return generatedFeedback;
                });
                setLastAutoText(generatedFeedback);
            }, [generatedFeedback]);

            const handleStageChange = (newStage) => {
                if (newStage === revisionStage) return;
                setRevisionStage(newStage);
            };

            const clearScores = () => {
                setScores({ content: '', language: '' });
                setScoreTouched({ content: false, language: false });
                setSelections({ content: null, language: null });
                setFeedbackText('');
            };

            const handleSelect = (category, itemIndex, selectedScore) => {
                setSelections(prev => ({ ...prev, [category]: itemIndex }));
                setScores(prev => ({ ...prev, [category]: selectedScore }));
                setScoreTouched(prev => ({ ...prev, [category]: true }));
            };

            const handleScoreChange = (category, value) => {
                if (value === '') {
                    setScores(prev => ({ ...prev, [category]: '' }));
                    setScoreTouched(prev => ({ ...prev, [category]: false }));
                    setSelections(prev => ({ ...prev, [category]: null }));
                    return;
                }
                let num = Number(value);
                if (!Number.isFinite(num)) return;
                if (num < 0) num = 0;
                if (num > currentRubrics[category].max) num = currentRubrics[category].max;
                setScores(prev => ({ ...prev, [category]: num }));
                setScoreTouched(prev => ({ ...prev, [category]: true }));
                setSelections(prev => ({ ...prev, [category]: null }));
            };

            const handleExaminerChange = (e) => {
                const val = e.target.value;
                setCurrentExaminer(val);
                localStorage.setItem('writingExamExaminer', val);
            };

            const handlePrint = () => {
                const originalTitle = document.title;
                const fileName = student.name ? `${student.class}_${student.name}_华文写作反馈_${revisionStage}` : `华文写作反馈单_${student.class}`;
                document.title = fileName;
                window.print();
                setTimeout(() => { document.title = originalTitle; }, 500);
            };

            const [selectedFormClass, setSelectedFormClass] = useState('');

            const availableFormClasses = useMemo(() => {
                return Array.from(
                    new Set(p5Roster.map(s => s.class).filter(Boolean))
                ).sort();
            }, []);

            // MT classes available within the selected Form Class.
            const availableMTClasses = useMemo(() => {
                if (!selectedFormClass) return [];
                return Array.from(
                    new Set(
                        p5Roster
                            .filter(s => s.class === selectedFormClass)
                            .map(s => s.mtl)
                            .filter(Boolean)
                    )
                ).sort();
            }, [selectedFormClass]);

            // Students are filtered by both Form Class and selected MT Class.
            const filteredStudents = useMemo(() => {
                if (!selectedFormClass || !student.mtl) return [];
                return p5Roster.filter(
                    s => s.class === selectedFormClass && s.mtl === student.mtl
                );
            }, [selectedFormClass, student.mtl]);

            const handleFormClassChange = (e) => {
                const formClass = e.target.value;
                setSelectedFormClass(formClass);
                setStudent({
                    class: formClass,
                    mtl: '',
                    name: ''
                });
            };

            const handleMTClassChange = (e) => {
                setStudent({
                    class: selectedFormClass,
                    mtl: e.target.value,
                    name: ''
                });
            };

            const handleStudentSelect = (e) => {
                const selectedName = e.target.value;
                if (!selectedName) {
                    setStudent({
                        class: selectedFormClass,
                        mtl: student.mtl,
                        name: ''
                    });
                    return;
                }

                const found = p5Roster.find(
                    s =>
                        s.class === selectedFormClass &&
                        s.mtl === student.mtl &&
                        s.name === selectedName
                );

                if (found) setStudent(found);
            };

            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            const waitForSubmissionStatus = async (requestId) => {
                for (let attempt = 0; attempt < 30; attempt++) {
                    try {
                        const statusUrl =
                            `${gasUrl}?action=status&requestId=${encodeURIComponent(requestId)}&_=${Date.now()}`;
                        const response = await fetch(statusUrl, {
                            method: 'GET',
                            cache: 'no-store'
                        });
                        const data = await response.json();
                        if (data && data.pending !== true) return data;
                    } catch (e) {
                        // Retry briefly; Apps Script can take a moment to publish the result.
                    }
                    await sleep(500);
                }
                throw new Error('Unable to confirm submission status.');
            };

            const handleSubmitGAS = async (forceDuplicate = false) => {
                if (!student.class || !student.mtl || !student.name || !currentExaminer) {
                    setDialog({
                        isOpen: true,
                        title: '⚠️ 资料不完整',
                        message: '请先选择级任班、母语班、学生和评卷老师。',
                        type: 'alert'
                    });
                    return;
                }

                if (
                    !scoreTouched.content ||
                    !scoreTouched.language ||
                    scores.content === '' ||
                    scores.language === ''
                ) {
                    setDialog({
                        isOpen: true,
                        title: '⚠️ 资料不完整',
                        message: '请完成内容和语文的评分后再提交成绩。',
                        type: 'alert'
                    });
                    return;
                }

                if (!student.name || !currentExaminer) {
                    setDialog({
                        isOpen: true,
                        title: '提示',
                        message: '请确保已选择学生和评卷老师。',
                        type: 'alert'
                    });
                    return;
                }

                setSubmitStatus('loading');

                const requestId =
                    `p5w_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;

                const payload = {
                    requestId,
                    formClass: student.class,
                    mtClass: student.mtl,
                    studentName: student.name,
                    revisionStage,
                    marker: currentExaminer,
                    contentScore: scores.content,
                    languageScore: scores.language,
                    totalScore: grandTotal,
                    finalContentScore: finalScoreResolution.content,
                    finalLanguageScore: finalScoreResolution.language,
                    finalTotalScore: finalScoreResolution.total,
                    finalScoreSource: finalScoreResolution.source,
                    maxTotal,
                    feedback: feedbackText,
                    timestamp: new Date().toLocaleString('zh-CN', { hour12: false }),
                    forceDuplicate
                };

                try {
                    // One submission request only. The server checks duplicates BEFORE saving.
                    await fetch(gasUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });

                    const result = await waitForSubmissionStatus(requestId);
                    setSubmitStatus('idle');

                    // Existing same student + same stage: nothing has been saved yet.
                    if (result && result.duplicate === true && result.saved === false) {
                        const previous = result.previous || {};
                        const previousMarker = previous.marker || '未记录';
                        const previousTotal =
                            previous.totalScore === '' || previous.totalScore == null
                                ? '未记录'
                                : `${previous.totalScore}分`;

                        setDialog({
                            isOpen: true,
                            title: '⚠️ 成绩已经提交',
                            message:
                                `学生：${student.name}\n\n` +
                                `批改阶段：${revisionStage}\n\n` +
                                `这名学生的${revisionStage}成绩已经提交过。\n\n` +
                                `上一次评卷老师：${previousMarker}\n\n` +
                                `上一次总分：${previousTotal}\n\n` +
                                `是否仍要提交这一次的成绩？`,
                            type: 'confirm',
                            confirmText: '继续提交',
                            cancelText: '取消',
                            onConfirm: () => handleSubmitGAS(true)
                        });
                        return;
                    }

                    if (!result || result.ok !== true || result.saved !== true) {
                        throw new Error((result && result.error) || 'Submission was not confirmed.');
                    }

                    const updatedHistory = {
                        ...studentScoresHistory,
                        [student.name]: {
                            ...(studentScoresHistory[student.name] || {}),
                            [revisionStage]: {
                                score: grandTotal,
                                content: contentTotal,
                                language: languageTotal,
                                marker: currentExaminer
                            }
                        }
                    };
                    setStudentScoresHistory(updatedHistory);

                    setDialog({
                        isOpen: true,
                        title: '✅ 提交成功！',
                        message:
                            `学生 ${student.name} 的 (${revisionStage}) 写作成绩已保存。\n` +
                            `评卷老师：${currentExaminer}`,
                        type: 'alert',
                        isSuccess: true
                    });

                } catch (error) {
                    setSubmitStatus('idle');
                    setDialog({
                        isOpen: true,
                        title: '提交状态未确认',
                        message:
                            '系统暂时无法确认这次提交的状态。请先查看 Google Sheet 是否已有新记录，再决定是否重试，以免重复提交。',
                        type: 'alert'
                    });
                }
            };

            const resetForm = () => {
                setDialog({
                    isOpen: true,
                    title: '确认清空',
                    message: '确定要清空当前分数，准备给下一位学生打分吗？',
                    type: 'confirm',
                    onConfirm: clearScores
                });
            };

            const renderRubricRow = (categoryKey, rubricObj) => (
                <div className="mb-10 bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 no-print">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h3 className="font-bold text-xl md:text-2xl text-slate-800">
                            {rubricObj.title} <span className="text-slate-400 text-lg font-medium">({rubricObj.max}分)</span>
                        </h3>
                        <div className="flex items-center space-x-3 bg-blue-50 px-4 py-2 rounded-xl border border-blue-200 w-full md:w-auto justify-between md:justify-start">
                            <span className="text-base md:text-lg text-blue-900 font-bold">得分:</span>
                            <div className="flex items-baseline">
                                <input 
                                    type="number" 
                                    min="0" max={rubricObj.max}
                                    value={scores[categoryKey]} 
                                    onChange={(e) => handleScoreChange(categoryKey, e.target.value)}
                                    className="w-16 text-center font-black text-2xl text-blue-700 bg-transparent border-b-2 border-blue-300 focus:outline-none focus:border-blue-700 transition-colors"
                                />
                                <span className="text-slate-500 font-medium ml-1">/{rubricObj.max}</span>
                            </div>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                        {rubricObj.items.map((item, index) => {
                            const isSelected = selections[categoryKey] === index;
                            return (
                                <div 
                                    key={index}
                                    onClick={() => handleSelect(categoryKey, index, item.scores[item.scores.length - 1])}
                                    className={`cursor-pointer rounded-xl p-4 transition-all duration-200 border-2 flex flex-col ${
                                        isSelected 
                                        ? 'border-blue-600 bg-blue-50 shadow-md ring-4 ring-blue-100 scale-[1.02]' 
                                        : 'border-slate-200 hover:border-blue-400 hover:bg-slate-50'
                                    }`}
                                >
                                    <div className="flex flex-wrap gap-2 mb-3">
                                        {item.scores.map(s => (
                                            <button
                                                key={s}
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    handleSelect(categoryKey, index, s);
                                                }}
                                                className={`w-9 h-9 md:w-10 md:h-10 rounded-lg flex items-center justify-center text-sm md:text-base font-black transition-all ${
                                                    isSelected && scores[categoryKey] === s 
                                                    ? 'bg-blue-600 text-white shadow-lg scale-110' 
                                                    : 'bg-white border-2 border-slate-300 text-slate-600 hover:bg-blue-100 hover:text-blue-800 hover:border-blue-400'
                                                }`}
                                            >
                                                {s}
                                            </button>
                                        ))}
                                    </div>
                                    <div className={`font-bold text-lg mb-2 ${isSelected ? 'text-blue-800' : 'text-slate-700'}`}>
                                        {item.label}
                                    </div>
                                    <div className={`text-sm leading-relaxed flex-grow ${isSelected ? 'text-blue-900/80 font-medium' : 'text-slate-500'}`}>
                                        {item.desc}
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-6 lg:p-8">
                    
                    {/* Modal Dialogs */}
                    {dialog.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4 no-print">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all border border-slate-200">
                                <div className={`p-10 ${dialog.isSuccess ? 'bg-green-50 text-center' : ''}`}>
                                    {dialog.isSuccess && <div className="text-7xl mb-6">🎉</div>}
                                    <h3 className={`font-black text-3xl mb-4 ${dialog.isSuccess ? 'text-green-800' : 'text-slate-900'}`}>
                                        {dialog.title || '提示'}
                                    </h3>
                                    <p className={`leading-relaxed text-xl whitespace-pre-line ${dialog.isSuccess ? 'text-green-900 font-medium' : 'text-slate-600'}`}>
                                        {dialog.message}
                                    </p>
                                </div>
                                <div className="p-6 bg-slate-50 border-t border-slate-100 flex justify-center space-x-4">
                                    {dialog.type === 'confirm' && (
                                        <button 
                                            onClick={() => setDialog({ ...dialog, isOpen: false })} 
                                            className="px-8 py-4 text-slate-600 font-bold text-lg hover:bg-slate-200 rounded-xl transition-colors w-full"
                                        >
                                            取消
                                        </button>
                                    )}
                                    <button 
                                        onClick={() => {
                                            const action = dialog.onConfirm;
                                            setDialog(prev => ({ ...prev, isOpen: false, isSuccess: false }));
                                            if (action) action();
                                        }} 
                                        className={`px-8 py-4 text-white font-black text-lg rounded-xl shadow-lg transition-colors w-full ${dialog.isSuccess ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        {dialog.type === 'confirm' ? (dialog.confirmText || '确定') : '我知道了'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Top Navigation & Info Bar */}
                    <div className="sticky top-0 z-10 bg-white/95 backdrop-blur-xl shadow-md border-b border-slate-200 rounded-b-3xl p-4 lg:p-5 mb-8 flex flex-col xl:flex-row justify-between items-start xl:items-center no-print gap-4 transition-all">
                        
                        <div className="flex flex-col space-y-4 w-full xl:w-auto">
                            {/* App Title and Stage Tabs */}
                            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                                <span className="text-2xl font-black bg-gradient-to-r from-blue-700 to-indigo-700 bg-clip-text text-transparent drop-shadow-sm whitespace-nowrap">雅德小学五年级华文写作</span>
                                
                                {/* Revision Stage Toggle Buttons */}
                                <div className="flex bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
                                    {['一改', '二改 (抽查)'].map((stage) => {
                                        const cleanStage = stage.startsWith('二改') ? '二改' : '一改';
                                        return (
                                            <button
                                                key={stage}
                                                onClick={() => handleStageChange(cleanStage)}
                                                className={`px-4 py-1.5 rounded-lg font-bold text-sm transition-all ${
                                                    revisionStage === cleanStage 
                                                    ? 'bg-blue-600 text-white shadow-inner'
                                                    : 'text-slate-500 hover:text-slate-700'
                                                }`}
                                            >
                                                {stage}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="flex flex-wrap items-center gap-3">
                                {/* 级任班 */}
                                <div className="flex items-center space-x-1">
                                    <span className="text-xs font-bold text-slate-500 uppercase">级任班:</span>
                                    <select
                                        value={selectedFormClass}
                                        onChange={handleFormClassChange}
                                        className="border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-slate-800 cursor-pointer shadow-sm"
                                    >
                                        <option value="">- 选择 -</option>
                                        {availableFormClasses.map(c => (
                                            <option key={c} value={c}>{c}</option>
                                        ))}
                                    </select>
                                </div>

                                {/* 母语班 */}
                                <div className="flex items-center space-x-1">
                                    <span className="text-xs font-bold text-slate-500 uppercase">母语班:</span>
                                    <select
                                        value={student.mtl}
                                        onChange={handleMTClassChange}
                                        disabled={!selectedFormClass}
                                        className="border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-slate-800 cursor-pointer shadow-sm disabled:bg-slate-100 disabled:cursor-not-allowed"
                                    >
                                        <option value="">- 选择 -</option>
                                        {availableMTClasses.map(m => (
                                            <option key={m} value={m}>{m}</option>
                                        ))}
                                    </select>
                                </div>

                                {/* 考生 */}
                                <div className="flex items-center space-x-1">
                                    <span className="text-xs font-bold text-slate-500 uppercase">考生:</span>
                                    <select
                                        value={student.name}
                                        onChange={handleStudentSelect}
                                        disabled={!student.mtl}
                                        className="w-48 md:w-72 border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-blue-700 shadow-sm cursor-pointer disabled:bg-slate-100 disabled:cursor-not-allowed"
                                    >
                                        <option value="">- 选择 -</option>
                                        {filteredStudents.map((s, i) => (
                                            <option key={`${s.name}-${i}`} value={s.name}>
                                                {s.name}
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                {/* 4. 评卷老师 */}
                                <div className="flex items-center space-x-1 md:border-l-2 md:border-slate-200 md:pl-3">
                                    <span className="text-xs font-bold text-purple-600 uppercase">评卷老师 ({revisionStage}):</span>
                                    <select 
                                        value={currentExaminer}
                                        onChange={handleExaminerChange}
                                        className="border-2 border-purple-200 rounded-xl px-3 py-2 bg-purple-50 focus:ring-4 focus:ring-purple-500/20 outline-none font-bold text-purple-800 shadow-sm cursor-pointer"
                                    >
                                        <option value="">- 选择 -</option>
                                        {examinersList.map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Dynamic Live Score Banner */}
                        <div className="flex items-center justify-end space-x-4 md:space-x-6 w-full xl:w-auto bg-white/50 xl:bg-transparent p-3 xl:p-0 rounded-2xl xl:rounded-none">
                            <div className="text-center">
                                <div className="text-xs text-slate-500 font-bold mb-1">内容</div>
                                <div className="font-black text-xl text-indigo-600">{contentTotal}<span className="text-sm text-slate-400 font-medium">/{maxContent}</span></div>
                            </div>
                            <div className="text-center">
                                <div className="text-xs text-slate-500 font-bold mb-1">语文</div>
                                <div className="font-black text-xl text-indigo-600">{languageTotal}<span className="text-sm text-slate-400 font-medium">/{maxLanguage}</span></div>
                            </div>
                            <div className="text-center px-6 py-2 rounded-2xl shadow-md bg-blue-600 text-white">
                                <div className="text-xs font-bold opacity-90 mb-1">{revisionStage}得分</div>
                                <div className="font-black text-3xl leading-none">{grandTotal}<span className="text-sm font-medium opacity-80 ml-1">/{maxTotal}</span></div>
                            </div>
                        </div>
                    </div>

                    {/* Marking Comparison & Final Score Card */}
                    {student.name && (score1 !== undefined || score2 !== undefined) && (
                        <div className="mb-8 no-print">
                            <div className="p-6 rounded-3xl bg-white border-2 border-slate-200 shadow-sm">
                                <h4 className="font-black text-slate-800 text-lg mb-3 flex items-center">
                                    📊 批改比对与最终判定成绩 ({student.name})
                                </h4>
                                <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 text-center">
                                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                        <span className="text-xs font-bold text-slate-500 block">一改 ({record1?.marker || '未记录'})</span>
                                        <span className="text-xl font-black text-slate-800">{score1 !== undefined ? `${record1.content}+${record1.language}=${score1}分` : '待评'}</span>
                                    </div>
                                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                        <span className="text-xs font-bold text-slate-500 block">二改 抽查 ({record2?.marker || (revisionStage === '二改' ? currentExaminer || '评估中' : '未记录')})</span>
                                        <span className="text-xl font-black text-slate-800">
                                            {revisionStage === '二改' ? `${contentTotal}+${languageTotal}=${grandTotal}分` : (score2 !== undefined ? `${record2.content}+${record2.language}=${score2}分` : '未抽查')}
                                        </span>
                                    </div>
                                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                        <span className="text-xs font-bold text-slate-500 block">分差 / 跨等判定</span>
                                        <span className="text-base font-black text-slate-700 block mt-1">
                                            {scoreDiff !== null ? `分差: ${scoreDiff}分 ${isCrossBand ? '(跨等 ⚠️)' : '(未跨等)'}` : '-'}
                                        </span>
                                    </div>
                                    <div className="p-3 rounded-2xl border border-emerald-300 bg-emerald-50 flex flex-col justify-center items-center">
                                        <span className="text-xs font-bold text-emerald-700 block">最终判定依据</span>
                                        <span className="text-sm font-black text-emerald-900 leading-tight mt-1">
                                            {finalScoreResolution.source}
                                        </span>
                                        <span className="text-lg font-black text-emerald-800 mt-1">
                                            {finalScoreResolution.content} + {finalScoreResolution.language} = {finalScoreResolution.total}分
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Print View */}
                    <div className="print-only print-container">
                        <div className="text-center mb-6 border-b-2 border-slate-200 pb-6">
                            <h1 className="text-3xl font-black text-slate-900 mb-2 tracking-wide">✍️ 雅德小学五年级华文写作反馈单 ✍️</h1>
                            <div className="flex justify-center flex-wrap gap-6 text-lg text-slate-700 font-medium">
                                <span>级任班：<strong className="text-slate-900 font-black">{student.class || "未选择"}</strong></span>
                                <span>母语班：<strong className="text-slate-900 font-black">{student.mtl || "未选择"}</strong></span>
                                <span>考生：<strong className="text-slate-900 font-black">{student.name || "未选择"}</strong></span>
                                <span>评卷老师：<strong className="text-slate-900 font-black">{currentExaminer || "未选择"}</strong></span>
                            </div>
                        </div>
                        
                        <div className="flex justify-center items-center gap-4 mb-8">
                            <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 w-36 text-center">
                                <div className="text-slate-600 font-bold text-sm mb-1">内容 (Content)</div>
                                <div className="text-2xl font-black text-slate-800">{finalScoreResolution.content} <span className="text-base font-normal text-slate-400">/ {maxContent}</span></div>
                            </div>
                            <div className="text-2xl text-slate-300 font-light">+</div>
                            <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 w-36 text-center">
                                <div className="text-slate-600 font-bold text-sm mb-1">语文 (Language)</div>
                                <div className="text-2xl font-black text-slate-800">{finalScoreResolution.language} <span className="text-base font-normal text-slate-400">/ {maxLanguage}</span></div>
                            </div>
                            <div className="text-2xl text-slate-300 font-light">=</div>
                            <div className="border-4 rounded-2xl p-5 w-44 text-center shadow-sm bg-emerald-50 border-emerald-200">
                                <div className="font-bold text-sm mb-1 text-emerald-700">最终总分 (Final Score)</div>
                                <div className="text-4xl font-black text-emerald-800">{finalScoreResolution.total} <span className="text-lg text-emerald-400">/ {maxTotal}</span></div>
                            </div>
                        </div>

                        <div className="mb-6">
                            <h2 className="text-xl font-black text-slate-900 mb-4 flex items-center">
                                <span className="w-8 h-8 rounded-full flex items-center justify-center mr-3 text-lg bg-blue-100 text-blue-700">💡</span> 
                                老师评估评语：
                            </h2>
                            <div className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-6 text-lg text-slate-800 leading-loose font-medium text-justify whitespace-pre-wrap min-h-[150px]">
                                {feedbackText || "老师还没有完成评分哦。"}
                            </div>
                        </div>
                        
                        <div className="text-center mt-10 text-slate-500 font-black text-lg tracking-widest">
                            加油！修改是写作进步的阶梯！✍️
                        </div>
                    </div>

                    {/* Interactive Rubrics Area */}
                    <div className="no-print">
                        <div className="mb-12">
                            <h2 className="text-2xl font-black text-slate-800 mb-6 px-4 border-l-8 rounded-sm border-blue-600">
                                第一部分：内容 ({maxContent}分)
                            </h2>
                            {renderRubricRow('content', currentRubrics.content)}
                        </div>

                        <div className="mb-12">
                            <h2 className="text-2xl font-black text-slate-800 mb-6 px-4 border-l-8 rounded-sm border-indigo-600">
                                第二部分：语文 ({maxLanguage}分)
                            </h2>
                            {renderRubricRow('language', currentRubrics.language)}
                        </div>

                        {/* Feedback Editor Area */}
                        <div className="mt-12 p-6 md:p-8 rounded-3xl border-2 shadow-sm bg-blue-50/50 border-blue-100">
                            <h3 className="font-black text-xl md:text-2xl mb-4 flex items-center text-blue-900">
                                📝 综合评估评语预览 
                                <span className="text-sm font-normal ml-3 px-3 py-1 rounded-full text-blue-600 bg-blue-100">
                                    {(revisionStage === '二改' || record2) ? '(根据二改标准自动整合评语)' : '(点击下方框随意修改或调整内容)'}
                                </span>
                            </h3>
                            <textarea 
                                className="w-full h-48 md:h-64 p-6 rounded-2xl border-2 focus:ring-4 outline-none resize-none text-slate-800 text-lg leading-relaxed text-justify shadow-inner bg-white border-blue-200 focus:ring-blue-500/20 focus:border-blue-500"
                                value={feedbackText}
                                onChange={(e) => setFeedbackText(e.target.value)}
                                placeholder="点击上方表格，这里会自动生成针对性的评语..."
                            ></textarea>
                            
                            <div className="flex flex-col md:flex-row justify-between items-center mt-8 gap-4 pt-6 border-t border-slate-200/60">
                                <button 
                                    onClick={resetForm} 
                                    className="flex items-center text-slate-600 bg-white hover:bg-slate-100 border-2 border-slate-200 font-bold text-base px-6 py-3 rounded-xl transition-all order-2 md:order-1 shadow-sm"
                                >
                                    🔄 清空重置 
                                </button>
                                
                                <div className="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3 w-full md:w-auto order-1 md:order-2">
                                    <button 
                                        onClick={handlePrint}
                                        className="justify-center bg-white border-2 border-slate-300 hover:border-slate-400 text-slate-800 px-6 py-3 rounded-xl font-bold text-base shadow-sm flex items-center transition-all"
                                    >
                                        🖨️ 打印/保存 PDF
                                    </button>
                                    <button 
                                        onClick={() => handleSubmitGAS(false)}
                                        disabled={submitStatus === 'loading'}
                                        className={`justify-center text-white px-8 py-3 rounded-xl font-bold text-base shadow-md flex items-center transition-all transform hover:-translate-y-0.5 ${
                                            submitStatus === 'loading' ? 'bg-indigo-400' : 'bg-indigo-600 hover:bg-indigo-700'
                                        }`}
                                    >
                                        {submitStatus === 'loading' ? '☁️ 提交中...' : '☁️ 提交云端表格'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
